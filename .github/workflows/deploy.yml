name: Deploy Next Hire

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Frontend .env
        run: |
          cat > client/.env << EOF
          # API Configuration
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          VITE_FRONTEND_URL=${{ secrets.VITE_FRONTEND_URL }}
          VITE_CLIENT_URL=${{ secrets.VITE_CLIENT_URL }}
          
          # Firebase Configuration
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          
          # Adzuna API
          VITE_APPLICATION_ID=${{ secrets.VITE_APPLICATION_ID }}
          VITE_APPLICATION_KEY=${{ secrets.VITE_APPLICATION_KEY }}
          VITE_ADZUNA_API_URL=${{ secrets.VITE_ADZUNA_API_URL }}
          
          # Social Media
          VITE_SOCIAL_FACEBOOK_URL=${{ secrets.VITE_SOCIAL_FACEBOOK_URL }}
          VITE_SOCIAL_TWITTER_URL=${{ secrets.VITE_SOCIAL_TWITTER_URL }}
          EOF

      - name: Create Server .env
        run: |
          cat > server/.env << EOF
          # MongoDB
          MONGODB_URL=${{ secrets.MONGODB_URL }}
          
          # Server Configuration
          PORT=3000
          NODE_ENV=${{ secrets.NODE_ENV }}
          BACKEND_URL=${{ secrets.BACKEND_URL }}
          SERVER_URL=${{ secrets.SERVER_URL }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          CLIENT_URL=${{ secrets.CLIENT_URL }}
          
          # Authentication
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRE=${{ secrets.JWT_EXPIRE }}
          COOKIE_EXPIRE=${{ secrets.COOKIE_EXPIRE }}
          
          # AI APIs
          GOOGLE_GENERATIVE_AI_API_KEY=${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          
          # Email
          RESEND_EMAIL_API_KEY=${{ secrets.RESEND_EMAIL_API_KEY }}
          EMAIL_USER=raorajan9576@gmail.com
          EMAIL_PASS=${{ secrets.EMAIL_PASS }}
          
          # Supabase
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_PRIVATE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_PRIVATE_ROLE_KEY }}
          
          # Cloudinary
          CLOUDINARY_NAME=${{ secrets.CLOUDINARY_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_SECRET_KEY=${{ secrets.CLOUDINARY_SECRET_KEY }}
          
          # Arbeitnow API
          ARBEITNOW_API_URL=${{ secrets.ARBEITNOW_API_URL }}
          EOF

      - name: Build Frontend Client
        run: |
          cd client
          npm install
          npm run build

      - name: Copy Files to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "client/dist/,server/"
          target: "/home/ubuntu/Next_Hire_Job_Portal"

      - name: Install Server Dependencies and Restart Backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            cd /home/ubuntu/Next_Hire_Job_Portal/server
            
            # Install production dependencies only
            npm install --omit=dev
            
            # Set secure permissions for .env file
            chmod 600 .env
            
            # Restart or start the backend with PM2
            pm2 restart next-hire || pm2 start src/app.js --name next-hire
            
            # Restart or start the frontend with PM2 (port 3001 for Nginx)
            cd /home/ubuntu/Next_Hire_Job_Portal/client
            pm2 restart nexthire-frontend || pm2 serve dist 3001 --spa --name nexthire-frontend

            # Save PM2 process list
            pm2 save
            
            echo "✅ Deployment completed successfully (Frontend on 3001, Backend on 3000)!"