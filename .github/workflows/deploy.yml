name: Deploy Next Hire

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend Client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_FRONTEND_URL: ${{ secrets.VITE_FRONTEND_URL }}
          VITE_CLIENT_URL: ${{ secrets.VITE_CLIENT_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_APPLICATION_ID: ${{ secrets.VITE_APPLICATION_ID }}
          VITE_APPLICATION_KEY: ${{ secrets.VITE_APPLICATION_KEY }}
          VITE_ADZUNA_API_URL: ${{ secrets.VITE_ADZUNA_API_URL }}
          VITE_SOCIAL_FACEBOOK_URL: ${{ secrets.VITE_SOCIAL_FACEBOOK_URL }}
          VITE_SOCIAL_TWITTER_URL: ${{ secrets.VITE_SOCIAL_TWITTER_URL }}
        run: |
          cd client
          npm install
          npm run build

      - name: Copy Files to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # We only copy the built frontend (dist) and the backend source. 
          # We purposefully leave out the heavy client node_modules!
          source: "client/dist/,server/"
          target: "/home/ubuntu/Next_Hire_Job_Portal"

      - name: Install Server Dependencies and Restart Backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            cd /home/ubuntu/Next_Hire_Job_Portal/server
            npm install --omit=dev  
            # Start or restart pm2 process
            pm2 restart nexthire-backend || pm2 start src/app.js --name nexthire-backend
