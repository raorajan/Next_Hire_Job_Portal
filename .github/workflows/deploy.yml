name: Deploy Next Hire

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend Client
        env:
          # If your Vite app requires environment variables at build time, 
          # add them here mapped to GitHub secrets.
          VITE_API_URL: /api
        run: |
          cd client
          npm install
          npm run build

      - name: Copy Files to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # We only copy the built frontend (dist) and the backend source. 
          # We purposefully leave out the heavy client node_modules!
          source: "client/dist/,server/"
          target: "/home/ubuntu/Next_Hire_Job_Portal"

      - name: Install Server Dependencies and Restart Backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/Next_Hire_Job_Portal/server
            npm install --omit=dev  
            # Start or restart pm2 process
            pm2 restart nexthire-backend || pm2 start src/app.js --name nexthire-backend
