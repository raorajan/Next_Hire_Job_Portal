server {
    listen 80;
    server_name nexthire.raorajan.pro nexthireapi.raorajan.pro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name nexthire.raorajan.pro;

    ssl_certificate /etc/letsencrypt/live/nexthire.raorajan.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexthire.raorajan.pro/privkey.pem;

    location / {
        proxy_pass http://nexthire-app:5173/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl;
    server_name nexthireapi.raorajan.pro;

    ssl_certificate /etc/letsencrypt/live/nexthire.raorajan.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexthire.raorajan.pro/privkey.pem;

    location / {
        proxy_pass http://nexthire-api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
