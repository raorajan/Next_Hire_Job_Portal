<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep professional tech blue -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- NH Letter Gradient: Clean Silver/White for clarity -->
    <linearGradient id="nhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Accent Gradient: Electric Cyan for the action/arrow -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Outer Glow for the letters to make it pop -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Round Background -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Logo Mark Group -->
  <g filter="url(#glow)">
    <!-- Letter N -->
    <path d="M116 344 V168 L204 344 V168" fill="none" stroke="url(#nhGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Letter H (Stems) -->
    <path d="M288 344 V168 M376 344 V168" fill="none" stroke="url(#nhGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- H Crossbar (The "Next" Arrow) -->
    <!-- Arrow shaft bridging the gap and breaking through -->
    <path d="M288 256 H396" fill="none" stroke="url(#accent)" stroke-width="36" stroke-linecap="round"/>
    <!-- Arrow head pointing to the future -->
    <path d="M364 224 L396 256 L364 288" fill="none" stroke="url(#accent)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
