<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0d9ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="92" height="92" rx="20" ry="20" fill="url(#bgGrad)" />

  <!-- Subtle inner highlight ring -->
  <rect x="7" y="7" width="86" height="86" rx="17" ry="17" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- Letter N - left vertical bar -->
  <rect x="20" y="30" width="8" height="40" rx="2" fill="url(#textGrad)" />

  <!-- Letter N - diagonal stroke -->
  <polygon points="28,30 36,30 52,62 52,70 44,70 28,38" fill="url(#textGrad)" />

  <!-- Letter N - right vertical bar -->
  <rect x="44" y="30" width="8" height="40" rx="2" fill="url(#textGrad)" />

  <!-- Letter H - left vertical bar -->
  <rect x="57" y="30" width="7" height="40" rx="2" fill="url(#textGrad)" />

  <!-- Letter H - crossbar -->
  <rect x="57" y="46" width="19" height="7" rx="2" fill="url(#textGrad)" />

  <!-- Letter H - right vertical bar -->
  <rect x="69" y="30" width="7" height="40" rx="2" fill="url(#textGrad)" />

  <!-- Small dot accent under letters -->
  <circle cx="50" cy="82" r="3" fill="rgba(255,255,255,0.4)" />
</svg>
